<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Sprint</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 700px;
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            padding: 50px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .environment {
            display: inline-block;
            padding: 12px 25px;
            border-radius: 30px;
            background: white;
            color: #667eea;
            font-weight: bold;
            font-size: 18px;
        }

        .info {
            margin-top: 25px;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📚 Study Sprint</h1>

        <p>
            Stay focused, study smarter, and achieve your goals
            one sprint at a time.
        </p>

        <div class="environment">
            Environment: staging
        </div>

        <p class="info">
            This page is served by an Express server.
        </p>

    </div>

</body>
</html>
